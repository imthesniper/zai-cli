name: Import approved ZC source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-zc-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'imthesniper/zai-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out destination
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: destination
      - name: Check out the approved source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Misbah-Engr/zai-cli
          ref: d7e88b2676d279b207e70dedb123b9eaf9999036
          path: source
          persist-credentials: false
      - name: Import source without executing it or replacing workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = d7e88b2676d279b207e70dedb123b9eaf9999036
          cd destination
          branch=release/zc-workbench-0.2.0
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo 'The import branch already exists. Nothing was overwritten.'
            exit 0
          fi
          git switch -c "$branch"
          rsync -a --exclude=.git --exclude=.github ../source/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- . ':!.github'
          git commit -m 'Import ZC 0.2.0 and macOS path repair from approved source' -m 'Source: Misbah-Engr/zai-cli@d7e88b2676d279b207e70dedb123b9eaf9999036. Workflow files are intentionally handled separately.'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Imported source to %s\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
